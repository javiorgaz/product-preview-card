<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <link
            rel="icon"
            type="image/png"
            sizes="32x32"
            href="./images/favicon-32x32.png"
        />
        <link rel="stylesheet" href="styles.css" />

        <title>Frontend Mentor | Product preview card component</title>
    </head>
    <body>
        <main class="main-wrapper">
            <div class="img-box margin-b-md">
                <img class="img" src="images/image-product-mobile.jpg" alt="" />
            </div>
            <div class="content">
                <p class="sub-heading margin-b-md">Perfume</p>
                <h1 class="heading-primary margin-b-md">
                    Gabrielle Essence Eau De Parfum
                </h1>
                <p class="text margin-b-md">
                    A flotal, solar and volumptuous interpretation composed by
                    Olivier Polge, Perfumer-Creator for the House of CHANEL.
                </p>
                <div class="price-wrapper">
                    <div class="actual-price">
                        <span>$</span>
                        149.99
                    </div>
                    <div class="before-price">
                        <span>$</span>
                        169.99
                    </div>
                </div>
                <button class="button">
                    <ion-icon class="button-icon" name="cart-outline"></ion-icon>
                    <span class="button-text">Add to Cart</span>
                </button>
            </div>
        </main>
        <script
            type="module"
            src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"
        ></script>
        <script
            nomodule
            src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"
        ></script>
    </body>
</html>
